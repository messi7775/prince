services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: prince
      POSTGRES_PASSWORD: prince
      POSTGRES_DB: prince_net
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prince -d prince_net"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: on-failure

  install-deps:
    image: node:22-bookworm-slim
    working_dir: /app
    volumes:
      - ./:/app
    command: ["sh", "-ec", "npm install -g pnpm@11.28.0 && pnpm install --frozen-lockfile && pnpm build:packages"]
    restart: "no"

  api:
    image: node:22-bookworm-slim
    working_dir: /app
    volumes:
      - ./:/app
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    environment:
      - NODE_ENV=development
      - PORT=3000
      - API_PREFIX=api/v1
      - DATABASE_URL=postgresql://prince:prince@db:5432/prince_net?schema=public
      - JWT_EXPIRES_IN=7d
      - JWT_COOKIE_NAME=prince_net_token
      - COOKIE_SECURE=false
      - COOKIE_SAME_SITE=lax
      - CORS_ORIGIN=http://localhost:5173
      - BACKUP_DIR=/tmp/prince-net-backups
      - CHOKIDAR_USEPOLLING=true
    command: ["sh", "-ec", "apt-get update -qq && apt-get install -y -qq --no-install-recommends procps >/dev/null && npm install -g pnpm@11.28.0 && mkdir -p /tmp/prince-net-backups && cd apps/api && pnpm prisma:generate && pnpm prisma:deploy && pnpm prisma:seed && exec pnpm dev"]
    depends_on:
      install-deps:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/api/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s
    restart: on-failure

  web:
    image: node:22-bookworm-slim
    working_dir: /app
    volumes:
      - ./:/app
    environment:
      - VITE_API_BASE_URL=/api/v1
      - VITE_APP_NAME=Prince Net
      - API_PROXY_TARGET=http://api:3000
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
      - CHOKIDAR_USEPOLLING=true
    command: ["sh", "-ec", "npm install -g pnpm@11.28.0 && cd apps/web && exec pnpm dev"]
    ports:
      - "3000:5173"
    depends_on:
      install-deps:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:5173').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    restart: on-failure

volumes:
  pgdata:
